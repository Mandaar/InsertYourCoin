services:
  # ---------------------------------------------------------------------------
  # paper -- boucle de paper trading (argent fictif, prix reels Kraken),
  # poche ETH. AUCUNE cle API requise en Phase 1 (donnees publiques uniquement).
  #
  # Mode protection, deux poches (2026-09-24, cf. docs/DEPLOY_DOCKER.md) :
  # TSMOM 365 seul, BTC + ETH, journalier, ordres limite, compteur neuf. Ce
  # service est la poche ETH ; `paper-btc` ci-dessous est la poche BTC -- meme
  # image, memes reglages partages, seuls le symbole et les fichiers de
  # /data/poches/ different. Les DEUX poches vivent SOUS /data/poches/ (pas a
  # la racine de /data, ou vit encore l'ancien historique SMA/ETH/5m --
  # /data/paper_state.json, /data/paper_stats.csv, /data/paper_trades.log --
  # INTACT et JAMAIS touche par ces deux services : le compteur neuf vient des
  # NOUVEAUX chemins, jamais d'un --reset, absent par construction de tout
  # `command:` de service (un redemarrage automatique le rejouerait).
  # ---------------------------------------------------------------------------
  paper:
    build: .
    image: insertyourcoin:latest
    container_name: iyc-paper
    restart: unless-stopped
    init: true
    # WORKDIR de CE service = le volume de donnees (pas /app). PaperTrader
    # (trading/paper_trader.py) ecrit ses fichiers en chemins RELATIFS au
    # repertoire de lancement quand --state/--stats sont omis (comportement
    # historique local) ; `paper` (la commande CLI) expose bien --state et
    # --stats (main.py, utilises ci-dessous pour separer les deux poches) --
    # seul --log n'existe pas comme flag CLI (il suit le dossier de --state,
    # cf. trading/reset.py::resolve_log_file). Fixer working_dir: /data reste
    # la facon la PLUS SURE de garantir que tout atterrit dans le volume
    # persistant, meme si un chemin explicite venait a manquer.
    working_dir: /data
    # GOTCHA (documente en detail dans docs/DEPLOY_DOCKER.md) : les
    # ${PAPER_STRATEGY:-...} ci-dessous sont resolus par `docker compose`
    # LUI-MEME, au moment ou il LIT ce fichier YAML -- AVANT meme de creer
    # le conteneur. C'est une substitution TEXTUELLE differente du mecanisme
    # `env_file:` (qui peuple l'environnement du PROCESSUS a l'interieur du
    # conteneur, et que `main.py paper` ne lit de toute facon jamais : ses
    # parametres sont des --flags CLI, pas des variables d'environnement).
    # Consequence pratique : `docker compose` doit etre invoque avec
    # `--env-file .env.deploy` pour que ces valeurs viennent REELLEMENT de
    # .env.deploy -- sinon la substitution retombe SILENCIEUSEMENT (aucune
    # erreur) sur les defauts codes ici (deja la cible : tsmom/1d/
    # lookback=365/limit, stops a 0 = desactives -- cf. .env.deploy.example).
    # Toutes les commandes de docs/DEPLOY_DOCKER.md incluent ce flag ; ne
    # l'omets jamais si tu adaptes une commande.
    command: >
      python -u /app/main.py paper
      --strategy ${PAPER_STRATEGY:-tsmom}
      --symbol ${PAPER_SYMBOL:-ETH/USD}
      --timeframe ${PAPER_TIMEFRAME:-1d}
      --stop-loss ${PAPER_STOP_LOSS:-0}
      --take-profit ${PAPER_TAKE_PROFIT:-0}
      --trailing-stop ${PAPER_TRAILING_STOP:-0}
      --params ${PAPER_PARAMS:-lookback=365}
      --order-type ${PAPER_ORDER_TYPE:-limit}
      --state /data/poches/eth_state.json
      --stats /data/poches/eth_stats.csv
    volumes:
      - iyc_data:/data
    networks:
      - iyc-internal
    # Phase 1 = pas de montage de .env (cles Kraken). Pour ajouter le live
    # PLUS TARD : voir docs/DEPLOY_DOCKER.md section "Ajouter le live plus
    # tard" (monte un .env en lecture seule sur un service `live` A PART,
    # jamais sur `paper` -- ce service reste 100% paper par construction).

  # ---------------------------------------------------------------------------
  # paper-btc -- meme boucle, poche BTC. IDENTIQUE au service `paper-btc` de
  # docker-compose.eunivers.yml (reverse-proxy existant), meme raisonnement
  # que `paper` ci-dessus.
  # ---------------------------------------------------------------------------
  paper-btc:
    build: .
    image: insertyourcoin:latest
    container_name: iyc-paper-btc
    restart: unless-stopped
    init: true
    working_dir: /data
    command: >
      python -u /app/main.py paper
      --strategy ${PAPER_STRATEGY:-tsmom}
      --symbol ${PAPER_BTC_SYMBOL:-BTC/USD}
      --timeframe ${PAPER_TIMEFRAME:-1d}
      --stop-loss ${PAPER_STOP_LOSS:-0}
      --take-profit ${PAPER_TAKE_PROFIT:-0}
      --trailing-stop ${PAPER_TRAILING_STOP:-0}
      --params ${PAPER_PARAMS:-lookback=365}
      --order-type ${PAPER_ORDER_TYPE:-limit}
      --state /data/poches/btc_state.json
      --stats /data/poches/btc_stats.csv
    volumes:
      - iyc_data:/data
    networks:
      - iyc-internal
    # Phase 1 = pas de montage de .env (cles Kraken), meme raisonnement que
    # `paper` ci-dessus.

  # ---------------------------------------------------------------------------
  # monitor -- serveur web de suivi (lecture seule des fichiers ecrits par
  # `paper`). N'est JAMAIS expose directement : aucun `ports:` ici, uniquement
  # joignable depuis `proxy` via le reseau Docker interne `iyc-internal`.
  # ---------------------------------------------------------------------------
  monitor:
    build: .
    image: insertyourcoin:latest
    container_name: iyc-monitor
    restart: unless-stopped
    init: true
    depends_on:
      - paper
      - paper-btc
    # Poche affichee par ce monitor : ETH (--stats/--log/--state ci-dessous).
    # Le monitor ne suit qu'un seul jeu de fichiers a la fois (C06, non
    # bloquant) -- la poche BTC se suit via `docker compose logs paper-btc`
    # ou `docker compose exec monitor cat /data/poches/btc_stats.csv`, cf.
    # docs/DEPLOY_DOCKER.md section "Mode protection, deux poches".
    command: >
      python -u /app/main.py monitor
      --host 0.0.0.0 --port 8765
      --stats /data/poches/eth_stats.csv
      --log /data/poches/eth_trades.log
      --state /data/poches/eth_state.json
      --live-root /data
    # --live-root /data (Lot 8B) : SANS EFFET tant que le service `live`
    # (docker-compose.live.yml, overlay optionnel NON active par defaut)
    # n'existe pas -- /live affiche simplement son mur habituel (aucun
    # fichier live/* sur le volume). Evite la classe de bug deja corrigee
    # pour --host/--stats/--log/--state (§11 de docs/DEPLOY_DOCKER.md) :
    # ajoute des l'introduction du parametre plutot qu'apres une 4e
    # occurrence identique.
    environment:
      # Footgun ferme par construction (docs/DEPLOY_DOCKER.md §7) : le bouton
      # Demarrer/Arreter de la page web /paper (Lot 7) spawnerait un SECOND
      # paper A L'INTERIEUR du conteneur monitor, isole du volume iyc_data --
      # deux historiques divergents, celui de la page web perdu au premier
      # redemarrage. Ici, `paper` est deja pilote par Docker
      # (restart: unless-stopped) : le bouton doit rester desactive. Le
      # service `paper` n'a pas besoin de ce flag (il ne sert pas /paper).
      - IYC_DISABLE_PAPER_CONTROL=1
    volumes:
      - iyc_data:/data
    networks:
      - iyc-internal
    healthcheck:
      # Sonde interne (127.0.0.1 DANS ce conteneur) : envoie naturellement
      # Host: 127.0.0.1:8765, ce que host_allowed() attend -- pas besoin de
      # reproduire la reecriture du proxy pour ce test.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # proxy -- Caddy : TLS + authentification, SEUL service qui publie un port
  # sur l'hote. Termine le HTTPS puis relaie vers `monitor` (reseau interne).
  # ---------------------------------------------------------------------------
  proxy:
    image: caddy:2-alpine
    container_name: iyc-proxy
    restart: unless-stopped
    depends_on:
      - monitor
    env_file:
      - .env.deploy
    ports:
      - "443:443"
      - "80:80"   # challenge ACME HTTP-01 (Let's Encrypt) -- necessaire en
                  # mode domaine ; inoffensif en mode IP (jamais sollicite).
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - iyc-internal

networks:
  iyc-internal:
    driver: bridge

volumes:
  # Donnees persistantes InsertYourCoin -- survit aux redemarrages/rebuilds/
  # `docker compose down` (sans --volumes). Recuperable via `docker cp` ou
  # `docker run --rm -v insertyourcoin_iyc_data:/data ... ` -- cf.
  # docs/DEPLOY_DOCKER.md. Contient l'ancien historique SMA/ETH/5m a la racine
  # (paper_state.json, paper_stats.csv, paper_trades.log -- INTACT, jamais
  # touche) ET les deux poches TSMOM sous poches/ (eth_*, btc_*).
  iyc_data:
  # Certificats TLS (Let's Encrypt ou CA interne Caddy) + config runtime Caddy
  # -- persistes pour ne pas re-emettre/re-generer a chaque redemarrage.
  caddy_data:
  caddy_config:
